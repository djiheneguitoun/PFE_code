# Réglages skrl de l'agent IPPO (réglage par défaut de train_ppo.py et eval.py).
# IPPO = PPO (algorithme d'apprentissage par renforcement courant) appliqué à chaque drone :
# politique partagée décentralisée, 3 drones = 1 seul cerveau. Chaque drone agit sur son
# observation locale ; tous optimisent le même réseau.
# graine aléatoire (remplaçable par --seed)
seed: 42


# separate: False => UN seul modèle policy + UN seul value, partagés par les 3 drones.
# policy = réseau qui choisit l'action (loi gaussienne : moyenne + écart-type appris) ;
# value = « critique », réseau qui estime la somme des récompenses futures attendues.
models:
  separate: False
  policy:  # gaussian_model
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256, 128]   # obs = 1820 (LiDAR + état + voisins + couverture)
        activations: elu
    output: ACTIONS
  value:  # deterministic_model
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256, 128]
        activations: elu
    output: ONE


# mémoire des pas collectés entre deux mises à jour du réseau
memory:
  class: RandomMemory
  memory_size: -1  # = agent:rollouts


# IPPO (cf. IPPO_DEFAULT_CONFIG)
agent:
  class: IPPO
  # pas collectés par environnement avant chaque mise à jour ; puis 5 passes en 4 mini-lots
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  # facteur d'actualisation γ (horizon ≈ 1/(1−γ) = 100 pas ≈ 3,3 s) et lissage λ de l'avantage (GAE)
  discount_factor: 0.99
  gae_lambda: 0.95
  # pas d'apprentissage, ajusté pour garder l'écart entre ancienne et nouvelle politique (KL) près de 0,008
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  # normalisation glissante (moyenne, écart-type) des observations et des valeurs
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  # poids du bonus d'entropie (pousse à explorer) : 0,05 ici, 0,01 pour MAPPO
  entropy_loss_scale: 0.05
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # dossier de sortie (journaux TensorBoard, checkpoints dont best_agent.pt), relatif au dossier de lancement ;
  # exclu du dépôt par .gitignore
  experiment:
    directory: "qr_inventory_swarm"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# durée de l'entraînement : nombre total d'appels à env.step, tous entrepôts ensemble (remplaçable par --timesteps)
trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
